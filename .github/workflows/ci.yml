name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test the calculator
        run: swift test --package-path QuickCalcCore
      - name: Build the app
        run: xcodebuild -project QuickCalc.xcodeproj -scheme QuickCalc -destination generic/platform=macOS -configuration Release -derivedDataPath build build
